# ============================================================
# Google Sheets (master schedule) Integration — TEMPLATE
# ============================================================
# Copy this file to "google_sheets.yaml" in this same directory and fill
# in the real values. google_sheets.yaml is gitignored (it points at a
# credential file) — only this template is committed.
#
# This lets "Push to Master Sheet" write an approved generated schedule
# into the department's real shared Google Sheet (one spreadsheet file
# per month, e.g. "2026-09 - September 2026 RAH NECHC Master Schedule"),
# and lets "Open from master sheet" read one of those months back into
# KEAsked as the active schedule with the same swap/edit tools available
# as any other load. A separate person enters learner (resident) pairings
# by hand into these same files — the push/read code never writes or
# reads that data; see google_sheets_client.py / sheets_schedule_reader.py.
#
# Two ways to authenticate. Pick one with `auth:` below.
#
# auth: oauth  (RECOMMENDED for a Gmail-based setup)
#   KEAsked signs in ONCE, in a browser, as the Google account that should
#   own the monthly master sheets (e.g. the scheduling mailbox). Files it
#   creates are owned by that account and live in its My Drive, so no
#   Shared Drive is needed. Setup, in Google Cloud Console on a project
#   under that account:
#     1. Enable the "Google Sheets API" and "Google Drive API".
#     2. Google Auth Platform -> Branding / OAuth consent screen: External,
#        any app name, your email. Audience -> "Publish app" (so the saved
#        sign-in does not expire after 7 days, which it does in Testing).
#        Google will show an "unverified app" warning when you sign in --
#        expected for a private tool; click Advanced -> continue.
#     3. Credentials -> Create credentials -> OAuth client ID -> Desktop
#        app. Download the JSON and save it as
#        scheduler/config/google_oauth_client.json (gitignored).
#     4. Run  .venv/bin/python3 scripts/google-oauth-login.py  on a machine
#        with a browser; sign in as that account. The token is saved as
#        scheduler/config/google_oauth_token.json (gitignored). For Unraid,
#        copy it over with scripts/sync-config-to-unraid.sh.
#     5. Share the Drive folder with nobody special -- the signed-in
#        account just needs to be able to edit it (its own folder, or one
#        shared with it as Editor). Put the folder id in drive_folder_id.
#
# auth: service_account
#   A robot identity with its own key file. Reads and writes files shared
#   with it, but CANNOT create files in a My Drive folder (service accounts
#   have no Drive storage) -- creating a new month's sheet only works when
#   the folder is on a Shared Drive (Google Workspace). Setup:
#   1. Enable the "Google Sheets API" and "Google Drive API" for that
#      project (APIs & Services -> Enable APIs and Services).
#   2. Create a Service Account (APIs & Services -> Credentials -> Create
#      Credentials -> Service Account). Any name is fine, e.g.
#      "keasked-master-schedule".
#   3. Generate a JSON key for that service account (Keys -> Add Key ->
#      Create new key -> JSON) and save it as
#      scheduler/config/google_service_account.json (gitignored — never
#      commit this file).
#   4. In Google Drive, share the folder that holds the monthly schedule
#      spreadsheet files with the service account's email address (looks
#      like ...@<project>.iam.gserviceaccount.com) as Editor. Start by
#      sharing a COPY of a real month's file in a throwaway folder while
#      this integration is new — point drive_folder_id at the real shared
#      folder only once a push + read-back has been verified end to end.
#   5. Copy that folder's id out of its Drive URL (the long id after
#      /folders/ in the address bar) into drive_folder_id below.
# ============================================================

# "oauth" or "service_account" -- see above.
auth: "oauth"

# auth: oauth -- the Desktop-app OAuth client JSON and the saved sign-in.
# Relative paths resolve against this same config directory.
oauth_client_secrets_path: "google_oauth_client.json"
oauth_token_path: "google_oauth_token.json"

# auth: service_account -- path to the service-account JSON key.
service_account_key_path: "google_service_account.json"

# The Drive folder id (from the folder's URL) containing one spreadsheet
# file per month. See setup step 4/5 above.
drive_folder_id: ""

# How each month's spreadsheet file is named, for finding/creating it.
# {year} is 4-digit, {month:02d} is zero-padded, {month_name} is the full
# English month name — matches the real file's observed naming exactly
# ("2026-09 - September 2026 RAH NECHC Master Schedule"). Adjust if the
# department's convention ever changes.
file_name_pattern: "{year}-{month:02d} - {month_name} {year} RAH NECHC Master Schedule"

# ============================================================
# sked (physician shift-preference site) Connection — TEMPLATE
# ============================================================
# Copy this file to "sked.yaml" in this same directory and fill in the
# admin secret. sked.yaml is gitignored (it holds a credential) — only
# this template is committed.
#
# This lets "Send Monthly Shift Requests" push the physician roster and
# that month's master schedule template to sked, generate each
# physician's signed magic link, and email it out via the same mailbox
# configured in email.yaml.
# --------------------------------------------------------------

# The deployed sked Worker's base URL (no trailing slash).
base_url: "https://sked.keatools.org"

# Same Worker/API as base_url, reachable at a second Custom Domain -- used
# only for the annual survey, so its links resolve to the survey page
# instead of the shift-preference grid. Leave blank to fall back to
# base_url + "/survey" instead of a clean subdomain.
survey_base_url: "https://survey.keatools.org"

# The admin secret set on the Worker via `wrangler secret put ADMIN_SECRET`.
# Get this from whoever deployed sked -- it is not the same as any physician
# link and grants full roster/period-template write access.
admin_secret: ""

# How many days a generated magic link stays valid before it expires.
#
# What this does and does not cover (sked's token = HMAC over
# physicianId + periodId + exp; sked/src/index.ts generate-period-links):
# - Applies to BOTH the monthly shift-request links and the annual survey
#   links -- both come from the same sked endpoint, only the domain differs.
# - After this many days the physician's link opens to "invalid or expired
#   token": they can neither load nor save their preference grid. Their saved
#   submission is untouched; resending (or Roster Editor "View in browser")
#   mints a fresh token with a new clock against the same stored data.
# - The period's close date is a SEPARATE, soft deadline: sked only shows
#   "N days left" / "LATE" text and never blocks a save on it. So set this
#   value to cover the whole entry window (send date -> close date), or the
#   links die before the deadline and need a resend.
# - Does NOT apply to the per-physician calendar feed (.ics) or the live
#   "my schedule" web view: those use a different token with a fixed
#   year-2099 expiry so the URL is permanent and identical every time.
link_days_valid: 31
